<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#18304b}.title{font-size:30px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#536779}.label{font-size:15px;fill:#1469a8;font-weight:600}</style>
<text x="48" y="55" class="title">Sequence diagram · student practice session</text>
