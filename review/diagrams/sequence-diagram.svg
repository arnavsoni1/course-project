<rect x="35" y="1215" width="1555" height="190" rx="0" fill="none" stroke="#536779" stroke-width="1.5"/>
<rect x="35" y="1215" width="90" height="28" rx="0" fill="#e8f3fb" stroke="#536779" stroke-width="1"/>
